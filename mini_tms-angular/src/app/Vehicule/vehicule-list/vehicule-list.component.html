<table border="1" cellpadding="20"
width="100%"
cellspacing="0"
align="center">
    <thead>
      <tr>
        <th>ID</th>
        <th>matricule</th>
        <th>modele</th>
        <th>type</th>
        <th>capacite</th>
        <th>statut</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of vehicules">
        <td>{{ c.id }}</td>
        <td>{{ c.matricule }}</td>
        <td>{{ c.modele }}</td>
        <td>{{ c.type }}</td>
        <td>{{ c.capacite }}</td>
        <td>c.statut</td>
      </tr>
    </tbody>
  </table>
