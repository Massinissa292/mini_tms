<div class="background">
<table border="1" cellpadding="20"
width="100%"
cellspacing="0"
align="center"
class="fr">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Téléphone</th>
        <th>Numéro Permis</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of conducteurs">
        <td>{{ c.id }}</td>
        <td>{{ c.nom }}</td>
        <td>{{ c.prenom }}</td>
        <td>{{ c.telephone }}</td>
        <td>{{ c.numeroPermis }}</td>
      </tr>
    </tbody>
  </table>
  </div>
