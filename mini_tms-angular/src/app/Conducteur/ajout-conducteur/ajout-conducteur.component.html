<div class="background">
<form #conducteurForm="ngForm" (ngSubmit)="onSubmit(conducteurForm)">
    <div>
      <label for="nom">Nom :</label><br />
      <input
        type="text"
        id="nom"
        name="nom"
        [(ngModel)]="conducteur.nom"
        required
      />
    </div>
  
    <div>
      <label for="prenom">Prénom :</label><br />
      <input
        type="text"
        id="prenom"
        name="prenom"
        [(ngModel)]="conducteur.prenom"
        required
      />
    </div>
  
    <div>
      <label for="telephone">Téléphone :</label><br />
      <input
        type="tel"
        id="telephone"
        name="telephone"
        [(ngModel)]="conducteur.telephone"
        pattern="[0-9]{10}"
        placeholder="Ex: 0123456789"
        required
      />
    </div>
  
    <div>
      <label for="numeroPermis">Numéro de Permis :</label><br />
      <input
        type="text"
        id="numeroPermis"
        name="numeroPermis"
        [(ngModel)]="conducteur.numeroPermis"
        required
      />
    </div>
  
    <div>
      <button type="submit" [disabled]="conducteurForm.invalid">
        Créer Conducteur
      </button>
    </div>
  </form>
  </div>
