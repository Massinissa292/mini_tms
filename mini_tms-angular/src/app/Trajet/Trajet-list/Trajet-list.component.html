<table border="1" cellpadding="20"
width="100%"
cellspacing="0"
align="center">
    <thead>
      <tr>
        <th>ID</th>
        <th>lieuDepart</th>
        <th>lieuArrivee</th>
        <th>dateHeure</th>
        <th>statut</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of Trajets">
        <td>{{ c.id }}</td>
        <td>{{ c.lieuDepart }}</td>
        <td>{{ c.lieuArrivee }}</td>
        <td>{{ c.dateHeure }}</td>
        <td>{{ c.statut }}</td>
      </tr>
    </tbody>
  </table>
