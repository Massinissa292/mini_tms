<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Texte sur image</title>
<style>
 .container {
  position: relative;
  width: 100%;
  height: 100vh; /* prend toute la hauteur de l’écran */
}

.image {
  width: 100%;
  height: 100%;
  object-fit: cover; /* l'image remplit l'écran sans être déformée */
}

.text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 3rem;
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
  margin-right: 10px;
}
.mon{
    width: 6cm;
    background-color: yellow;
    color: darkblue;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bolder;
}

</style>
</head>
<body>

<div class="container">
  <img src="assets/DE.png" alt="Image" class="image">
  <div class="text"><h1> Bienvenue dans mon site Achly
    </h1> <button class="mon"  routerLink="/Ajouter"    >Reserver maintenant</button> 
  </div>
</div>

</body>
</html>
